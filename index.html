<style>
:root{
  --bg:#0f1216;--panel:#171b21;--panel2:#1e242c;--line:#2a313b;--text:#e6e9ee;--muted:#9aa4b2;
  --accent:#6ea8fe;--solid:#4cc38a;--studying:#f5b94a;--none:#5b6573;--danger:#ef6b6b;
  --r:12px;--tap:48px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(15,18,22,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 12px calc(10px) 12px;padding-top:max(10px,env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:8px;max-width:1100px;margin:0 auto}
h1{font-size:19px;margin:0;flex:1;letter-spacing:.3px}
.tabs{display:flex;gap:6px;max-width:1100px;margin:10px auto 0}
.tab{flex:1;min-height:44px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-weight:600;color:var(--muted)}
.tab.active{background:var(--panel2);color:var(--text);border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:12px 12px 120px}
.btn{min-height:var(--tap);padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b1220;font-weight:600}
.btn.danger{border-color:#5a2a2a;color:var(--danger)}
.btn.small{min-height:40px;padding:0 10px;font-size:14px}
.icon{width:var(--tap);padding:0}
input[type=text],input[type=url],input[type=search],textarea,select{width:100%;min-height:var(--tap);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:140px;resize:vertical}
.search{margin-bottom:12px}
.pillar{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.phead{padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:8px}
.ptitle{flex:1;font-weight:700;font-size:17px;text-align:left;background:none;border:0;padding:6px 0;min-height:var(--tap)}
.bot{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.4px;padding:3px 8px;border-radius:999px;background:#25324a;color:#b9d2ff;border:1px solid #33456a;white-space:nowrap}
.prog{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--solid);width:0}
ul.tree{list-style:none;margin:0;padding:0}
ul.tree ul{list-style:none;margin:0;padding:0 0 0 18px;border-left:1px dashed var(--line);margin-left:22px}
.node{display:flex;align-items:center;gap:4px;min-height:var(--tap)}
.tog{width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:14px;flex:none;border-radius:8px}
.tog.empty{visibility:hidden}
.nbtn{flex:1;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;min-height:var(--tap);padding:6px 8px;border-radius:8px}
.nbtn:hover,.tog:hover{background:var(--panel2)}
.nbtn.sel{background:#1f2a3a}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--none);border:2px solid var(--none)}
.dot.studying{background:var(--studying);border-color:var(--studying)}
.dot.solid{background:var(--solid);border-color:var(--solid)}
.dot.notstarted{background:transparent}
.badge{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
mark{background:#4a3b12;color:#ffe2a0;border-radius:3px;padding:0 1px}
.ptree{padding:4px 6px 8px}
.empty-msg{color:var(--muted);padding:20px;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 12px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease;padding:14px 14px max(18px,env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.scrim.open{display:block}
.grab{width:44px;height:5px;background:var(--line);border-radius:9px;margin:0 auto 10px}
.sheet h2{font-size:18px;margin:0;flex:1;word-break:break-word}
.crumb{font-size:12px;color:var(--muted);margin:2px 0 10px}
.sec{margin-top:16px}
.sec>label,.lbl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:6px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:var(--tap);border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:14px}
.seg button.on[data-s=notstarted]{border-color:var(--muted);background:#2a3038}
.seg button.on[data-s=studying]{border-color:var(--studying);background:#3a2f15;color:#ffd98a}
.seg button.on[data-s=solid]{border-color:var(--solid);background:#14352a;color:#9ff0c8}
.seg.lvl button{font-size:12px;padding:0 2px}
.seg.lvl button.on{border-color:#7aa2ff;background:#1b2747;color:#c8d8ff}
.lsn-tabs{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap}
.lsn-tabs button{flex:1;min-height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:11px;padding:0 2px}
.lsn-tabs button.on{border-color:#7aa2ff;background:#1b2747;color:#c8d8ff}
.lsn-tabs button.cur::after{content:' •'}
.lsn-prog{font-size:13px;color:var(--muted);margin:4px 0 6px}
.lsn{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.lsn .chk{flex:0 0 30px;height:30px;border-radius:8px;border:2px solid var(--line);background:transparent;font-size:18px;line-height:1;color:var(--solid);display:flex;align-items:center;justify-content:center}
.lsn .chk.on{border-color:var(--solid);background:#14352a}
.lsn .lt{flex:1;font-size:14px}
.lsn.done .lt{color:var(--muted)}
.lsn .ed{flex:0 0 30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:15px}
.lsn-note{font-size:12px;color:var(--muted)}
.lsn-up{width:100%;margin-top:8px}
.lsn-master{margin-top:8px;padding:8px;border-radius:10px;border:1px solid var(--solid);background:#14352a;color:#9ff0c8;font-size:14px;text-align:center}
.lvlb{font-size:10px;padding:1px 6px;border-radius:8px;border:1px solid #7aa2ff;color:#c8d8ff;margin-left:6px;white-space:nowrap}
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.src{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.src .t{flex:1;min-width:0}
.src .t b{display:block;font-weight:600;word-break:break-word}
.src .t a,.src .t small{color:var(--accent);font-size:13px;word-break:break-all}
.row2{display:grid;grid-template-columns:1fr;gap:6px}
.saved{font-size:12px;color:var(--muted);height:16px;margin-top:4px}
/* novel */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:17px}
.sub{color:var(--muted);font-size:14px;margin:0 0 10px}
.idea{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.idea:last-child{border-bottom:0}
.idea .txt{flex:1;word-break:break-word}
.idea.done .txt{text-decoration:line-through;color:var(--muted)}
.chk{width:28px;height:28px;accent-color:var(--solid);flex:none}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.note .meta{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.link{color:var(--accent);background:none;border:0;padding:6px 0;text-decoration:underline;font-size:14px;min-height:40px}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.menu{display:grid;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#263042;border:1px solid #33456a;padding:10px 16px;border-radius:10px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (min-width:900px){
  .sheet{left:auto;top:0;width:440px;max-height:none;border-radius:0;border-left:1px solid var(--line);border-top:0;transform:translateX(105%)}
  .sheet.open{transform:none}
  .grab{display:none}
  .scrim,.scrim.open{display:none}
  main.withsheet{margin-right:460px}
  body.sheetopen header{padding-right:460px}
}
</style>
</head>

  case 'ideadel': if(confirm('Delete this idea?')){state.novel.ideas=state.novel.ideas.filter(function(x){return x.id!==id});save();renderNovel()} break;
  case 'noteadd': {var nn2={id:uid(),title:'',text:'',topicId:''}; state.novel.notes.push(nn2); save(); renderNovel(); var ti=$('[data-nid="'+nn2.id+'"][data-field=title]'); if(ti){ti.focus();ti.scrollIntoView({block:'center'})} break;}
  case 'notedel': if(confirm('Delete this research note?')){var nid=el.getAttribute('data-nid');state.novel.notes=state.novel.notes.filter(function(x){return x.id!==nid});save();renderNovel()} break;
  case 'export': exportJSON(); break;
  case 'import': $('#importFile').value=''; $('#importFile').click(); break;
  case 'expandall': case 'collapseall': walk(state.tree,function(n){n.collapsed=(a==='collapseall')}); save(); closeSheet(); switchTab('map'); break;
  case 'reset': if(confirm('Reset to the original map? This erases all notes, sources, statuses, edits and novel notes on this device.')){state=seedState();save();closeSheet();render();toast('Reset to seed')} break;
  }
}

function switchTab(t){
  tab=t; $('#tabMap').classList.toggle('active',t==='map'); $('#tabNovel').classList.toggle('active',t==='novel');
  $('#mapView').hidden=t!=='map'; $('#novelView').hidden=t!=='novel'; render();
}
function render(){ if(tab==='map') renderTree(); else renderNovel(); }

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  var a=el.getAttribute('data-act'); if(a==='ideadone') return; act(a,el);
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.getAttribute('data-act')==='ideadone'){act('ideadone',el);return}
  if(el.id==='importFile'&&el.files&&el.files[0]){var r=new FileReader();r.onload=function(){importText(r.result)};r.readAsText(el.files[0]);return}
  if(el.getAttribute('data-field')==='topicId'){var n=noteById(el.getAttribute('data-nid')); if(n){n.topicId=el.value;save();renderNovel()}}
});
function noteById(id){return state.novel.notes.filter(function(x){return x.id===id})[0]}
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='search'){query=el.value.trim();renderTree();return}
  if(el.id==='notes'&&selId){var f=find(selId); if(f){f.node.notes=el.value; clearTimeout(saveT); saveT=setTimeout(function(){save(); var m=$('#savedMsg'); if(m) m.textContent='Saved'; renderTree()},300)} return}
  var fld=el.getAttribute('data-field');
  if(fld==='title'||fld==='text'){var n=noteById(el.getAttribute('data-nid')); if(n){n[fld]=el.value; clearTimeout(saveT); saveT=setTimeout(save,300)}}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='ideaIn'){act('ideaadd',e.target)}
  if(e.key==='Enter'&&(e.target.id==='srcTitle'||e.target.id==='srcUrl')){act('addsrc',e.target)}
  if(e.key==='Escape'&&$('#sheet').classList.contains('open')) closeSheet();
});
$('#scrim').addEventListener('click',closeSheet);
$('#menuBtn').addEventListener('click',openMenu);
document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){closeSheet();switchTab(b.getAttribute('data-tab'))})});
window.addEventListener('beforeunload',function(){clearTimeout(saveT);save()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){clearTimeout(saveT);save()}});

state=load(); save(); render();
window.__mor={get state(){return state},seed:SEED_TREE,key:KEY,importText:importText};
})();
</script>
</body>
</html>
